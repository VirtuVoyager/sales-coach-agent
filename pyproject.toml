[project]
name = "sales-coach-agent"
version = "0.1.0"
description = "Multi-agent sales simulation system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "chainlit>=1.0.400",
    "langgraph>=0.0.30",
    "langchain>=0.1.13",
    "langchain-openai>=0.1.1",
    "langchain-huggingface>=0.0.2",
    "pymongo>=4.6.2",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.1.0",
    "pdfminer-six>=20231228",
    "pydantic-settings>=2.2.1",
    "langchain-community>=0.4.1",
    "torch>=2.10.0",
    "sentence-transformers>=5.3.0",
    "langgraph-checkpoint-mongodb>=0.3.1",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.2",
    "certifi>=2026.2.25",
    "opik>=1.10.44",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "black>=24.3.0",
    "isort>=5.13.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: prompt evaluation tests — require RUN_EVALS=1 and a live LLM",
]
# Separate unit/integration from evals by default
addopts = "-m 'not eval'"
